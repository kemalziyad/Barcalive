# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line. The JAVA_HOME environment variable should be set to point to
# the JDK being used to build the project.

# Gradle JVM arguments for better performance
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# Enable parallel gradle builds
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true

# Kotlin compiler options
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.code.style=official

# Android-specific settings
android.useAndroidX=true
android.enableJetifier=true

# Build features
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.compose=true

# Signing config (for release builds)
# Set these via environment variables or local.properties for security
# KEYSTORE_PATH=/path/to/my-upload-key.jks
# STORE_PASSWORD=your_store_password
# KEY_PASSWORD=your_key_password
